<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Independent Medusa prediction heads</title>
  <desc id="desc">One frozen Transformer hidden state feeds the ordinary language-model head and three parallel Medusa heads. The heads predict progressively farther future tokens without consuming one another's predictions.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">Independent future-token predictions from one hidden state</text>

  <rect x="55" y="194" width="320" height="230" rx="24" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="215" y="250" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Frozen Transformer</text>
  <text x="215" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#cbd5e1">prefix x&#x2264;t</text>
  <rect x="112" y="322" width="206" height="62" rx="14" fill="#334155"/>
  <text x="215" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#67e8f9">hidden state h<tspan baseline-shift="sub" font-size="18">t</tspan></text>

  <path d="M375 309 H468" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M440 309 V140 H510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M440 309 V252 H510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M440 309 V364 H510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M440 309 V476 H510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="510" y="92" width="280" height="96" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="650" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">Ordinary LM head</text>
    <text x="650" y="160" text-anchor="middle" font-size="21" fill="#1e40af">predicts x<tspan baseline-shift="sub" font-size="15">t+1</tspan> (the root)</text>

    <rect x="510" y="204" width="280" height="96" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="650" y="242" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">Medusa head 0</text>
    <text x="650" y="272" text-anchor="middle" font-size="21" fill="#166534">predicts x<tspan baseline-shift="sub" font-size="15">t+2</tspan></text>

    <rect x="510" y="316" width="280" height="96" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="650" y="354" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">Medusa head 1</text>
    <text x="650" y="384" text-anchor="middle" font-size="21" fill="#92400e">predicts x<tspan baseline-shift="sub" font-size="15">t+3</tspan></text>

    <rect x="510" y="428" width="280" height="96" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="650" y="466" text-anchor="middle" font-size="24" font-weight="700" fill="#581c87">Medusa head 2</text>
    <text x="650" y="496" text-anchor="middle" font-size="21" fill="#6b21a8">predicts x<tspan baseline-shift="sub" font-size="15">t+4</tspan></text>
  </g>

  <path d="M790 252 H850" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M790 364 H850" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M790 476 H850" fill="none" stroke="#9333ea" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="850" y="198" width="300" height="332" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1000" y="245" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Key constraint</text>
  <text x="1000" y="292" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">Every head sees the same h<tspan baseline-shift="sub" font-size="15">t</tspan>.</text>
  <text x="1000" y="331" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">Head 1 does not consume</text>
  <text x="1000" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">head 0's token.</text>
  <text x="1000" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">Head 2 does not consume</text>
  <text x="1000" y="434" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334155">either earlier prediction.</text>
  <text x="1000" y="486" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#475569">Parallel, not recursive</text>

  <text x="600" y="582" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b">The target model verifies candidate prefixes before any speculative token is committed.</text>
</svg>

- company: Adobe
  position: Machine Learning Engineer Intern
  period: May 2025 - August 2025
  location: San Jose, California
  highlights:
    - Built an LLM as Judge evaluation framework with LiteLLM to benchmark Gemini 2.5 Pro, GPT 4.1, and Claude 4.5 on multimodal chart quality tasks, improving offline F1 from 79 percent to 92 percent through redesigned scoring metrics.
    - Automated a 48 hour manual evaluation workflow into a 30 minute pipeline with a LangGraph agent, Model Context Protocol, Adobe PDF Spaces, and a human approval gate.
    - Added structured output validation and rerouting across multiple model providers so failed generations were caught before reaching users.

- company: S and P Global
  position: Data Scientist II
  period: November 2022 - August 2024
  location: Hyderabad, India
  highlights:
    - Owned a Llama 2 extraction service on SageMaker and AWS Lambda from architecture through deployment and support, removing about 20 minutes of manual lookup per analyst task.
    - Fine tuned and deployed LayoutLMv3 for token classification on AWS EC2, turning unstructured financial documents into structured fields for downstream search and verification.
    - Designed and deployed a T5 question answering API over long financial filings, including logic to resolve current year values from document context.
    - Replaced a paid third party vendor with an in house Java extraction service built on named group regular expressions, reducing licensing cost and analyst review time.

- company: American Express
  position: Data Scientist I
  period: December 2021 - November 2022
  location: Gurugram, India
  highlights:
    - Built and containerized the VIBE call quality service with Docker, combining XGBoost and BERT embeddings for a system used to support representative bonus decisions.
    - Deployed an LSTM demand prediction service with Flask on AWS EC2 to map call transcripts to demand types and prioritize high value customer calls.
    - Trained and deployed a complaint risk classifier with calibrated probabilities and used PySpark to identify missing offer disclosures in transcript data.

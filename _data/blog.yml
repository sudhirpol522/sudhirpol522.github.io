llm_inference_series:
  - title: "Demystifying GPTQ: From Lagrange Multipliers to Vectorized PyTorch"
    url: /blog/demystifying-gptq/
    description: >-
      Derives the GPTQ weight-quantization update from scratch with Lagrange multipliers,
      shadow-runs a 2D example by hand, and translates it into vectorized PyTorch. Covers the
      inverse-Hessian compensation that lets 4-bit LLMs keep their perplexity.

  - title: "Minimal LLM Inference: Continuous Batching"
    url: https://sudhirpol522.medium.com/minimal-llm-inference-continuous-batching-df37779b1c18
    description: >-
      Implements the scheduling loop, iteration-level batching, and KV-cache eviction policy that
      power high-throughput LLM serving. Explains why sequential serving leaves 70%+ of GPU compute idle.

  - title: "Speculative Decoding: The Clever Trick Making LLMs 2x Faster"
    url: https://sudhirpol522.medium.com/speculative-decoding-the-clever-trick-making-llms-2-faster-69a2adee98a7
    description: >-
      Full derivation of the draft-verify acceptance probability, gamma sweep analysis for optimal
      draft length, and wall-clock benchmarks comparing DistilGPT2-drafted vs. standard GPT-2 decoding.

  - title: Accelerating Transformer Inference with KV Caching
    url: https://sudhirpol522.medium.com/accelerating-transformer-inference-with-kv-caching-9949c71da392
    description: >-
      Derives exact VRAM consumption for KV cache given model width, heads, and sequence length.
      Walks through a from-scratch PyTorch implementation showing precisely where and why memory
      explodes with context length.

  - title: "LoRA: Building on Fundamental Principles for Low-Rank Adaptation"
    url: https://sudhirpol522.medium.com/lora-building-on-fundamental-principles-for-low-rank-adaptation-0288b3626fc2
    description: >-
      Implements LoRA rank decomposition without any PEFT library, covering the math behind
      low-rank approximations and demonstrating significant parameter reduction with minimal quality loss.

  - title: Reward Model Training for RLHF
    url: https://sudhirpol522.medium.com/reward-model-training-6d1693e41962
    description: >-
      Trains a reward model from paired preference data for an RLHF pipeline — covering loss
      functions, Bradley-Terry model math, and training stability tricks for robust preference learning.

kaggle_writeups:
  - title: "Bristol-Myers Squibb Molecular Translation — Part 1: Introduction and EDA"
    url: https://sudhirpol522.medium.com/bristol-myers-squibb-molecular-translation-part-1-introduction-and-eda-b41bb33bf6f6
    description: >-
      Overview of the Kaggle molecular translation challenge, dataset exploration, and analysis of
      IUPAC name distributions. Sets up the problem framing for the deep learning approach.

  - title: "Bristol-Myers Squibb Molecular Translation — Part 2: Deep Learning Modelling with LSTM"
    url: https://sudhirpol522.medium.com/bristol-myers-squibb-molecular-translation-part-2-deep-learning-modelling-lstm-fcc8fc26a14f
    description: >-
      Details the EfficientNet + LSTM + Bahdanau Attention architecture, TPU training strategy,
      Teacher Forcing, beam search, and final results achieving Levenshtein distance 8.9 (top 500).

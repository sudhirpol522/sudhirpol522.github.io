- title: Continuous Batching Inference Server
  tags: [Python, LLM Inference, vLLM]
  github: https://github.com/sudhirpol522/Continuous-Batching
  description: >-
    Minimal LLM inference server from scratch featuring a continuous batching engine with dynamic
    request scheduling — the same core mechanism behind vLLM's throughput advantage over naive
    sequential serving. Handles variable-length requests, manages a KV-cache budget, and preempts
    lower-priority sequences under VRAM pressure.

- title: "Speculative Decoding: DistilGPT2 + GPT-2"
  tags: [PyTorch, Speculative Decoding, LLM]
  github: https://github.com/sudhirpol522/Speculative-Decoding
  description: >-
    Full draft-verify loop from scratch using DistilGPT2 as the draft model and GPT-2 as the target.
    Derives acceptance probability from first principles, runs gamma sweep benchmarks to find the
    optimal draft length, and measures wall-clock speedup. Companion to the Medium article.

- title: Multi-Document RAG System
  tags: [RAG, FAISS, Python, MLflow]
  github: https://github.com/sudhirpol522/Multi-Doc-RAG
  description: >-
    Production-grade multi-document RAG pipeline: semantic chunking, FAISS dense retrieval,
    cross-encoder reranking, AWQ/GPTQ quantization, and MLflow experiment tracking. Demonstrates
    the full retrieval stack at the fidelity expected in a production MLE role.

- title: CUDA Kernel Optimization
  tags: [CUDA C++, GPU Computing, Performance]
  github: https://github.com/sudhirpol522/CUDA
  description: >-
    Practice repository for writing and profiling CUDA kernels targeting ML workloads —
    memory-coalesced matrix multiply, tiled GEMM, softmax, and attention kernels. Benchmarked
    using CUDA events and Nsight; focus on understanding memory hierarchy, warp utilization,
    and occupancy.

- title: Blog Writing Agent
  tags: [Python, Agentic AI, LangGraph]
  github: https://github.com/sudhirpol522/blog-writing-agent
  description: >-
    Autonomous multi-step agent that researches a topic, outlines structure, drafts sections,
    and self-reviews content before producing a finished blog post. Built with a LangGraph
    workflow and tool-use loop — demonstrates end-to-end agentic pipeline design with
    human-in-the-loop checkpoints.

- title: Research Agent
  tags: [Python, Agentic AI, Tool Use]
  github: https://github.com/sudhirpol522/Reasearch-Agent
  description: >-
    Agentic research assistant that autonomously queries multiple sources, synthesizes information,
    and produces structured summaries. Uses a ReAct-style reasoning loop with web search and
    document retrieval tools, illustrating how to compose reliable agent workflows for
    knowledge-intensive tasks.

- title: "Bristol-Myers Squibb Molecular Translation — Kaggle"
  tags: [Python, TensorFlow, EfficientNet, LSTM, TPU]
  date: Jan 2021
  github: https://github.com/sudhirpol522/BMS-New
  blog_part1: https://sudhirpol522.medium.com/bristol-myers-squibb-molecular-translation-part-1-introduction-and-eda-b41bb33bf6f6
  blog_part2: https://sudhirpol522.medium.com/bristol-myers-squibb-molecular-translation-part-2-deep-learning-modelling-lstm-fcc8fc26a14f
  description: >-
    Image captioning model for molecular IUPAC name prediction using an Encoder-Decoder architecture
    on Kaggle TPUs. Applied Teacher Forcing and beam search with EfficientNet V3 encoder and LSTM
    decoder with Bahdanau Attention, achieving a Levenshtein distance of 8.9 and ranking in the
    top 500 globally. Cut training time by 1.5 days via efficient TPU preprocessing.

- title: "NFL Big Data Bowl 2020 — Kaggle"
  tags: [Python, Scikit-learn, Flask, Pandas]
  date: Nov 2020
  github: https://github.com/sudhirpol522/Heroku-NFL
  description: >-
    Developed machine learning models for predicting NFL rushing play outcomes. Engineered
    spatiotemporal features from player tracking data and applied isotonic regression for
    probability calibration, achieving a CRPS of 0.017 and ranking 237th globally. Deployed
    the model as a Flask application on Heroku.

- title: "Neural Machine Translation — Italian to English"
  tags: [Python, TensorFlow, Seq2Seq, Attention]
  description: >-
    Sequence-to-sequence neural machine translation system for Italian-to-English translation
    with attention mechanism. Achieved a BLEU score of 0.83 using a bidirectional LSTM encoder
    with Bahdanau attention and beam search decoding.

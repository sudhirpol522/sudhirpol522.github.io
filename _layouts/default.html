<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "About" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  {% include header.html %}
  <main class="page-content">
    <div class="wrapper{% if page.layout == 'about' %} wrapper--about{% endif %}">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
</body>
</html>

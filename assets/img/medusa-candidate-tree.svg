<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Two-level Medusa candidate tree</title>
  <desc id="desc">After the prompt token I and base prediction like, the first Medusa head proposes cats and dogs. The second proposes today and too beneath each branch, creating six verification nodes and four complete candidates.</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; }
      .prompt { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .base { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .head1 { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .head2 { fill: #dcfce7; stroke: #047857; stroke-width: 2; }
      .title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .level { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .caption { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="930" height="450" rx="18"/>
  <text class="title" x="42" y="55">Two Medusa heads, six verification nodes</text>

  <text class="level" x="105" y="105">Prompt</text>
  <text class="level" x="280" y="105">Base LM</text>
  <text class="level" x="505" y="105">Head 1 (s1 = 2)</text>
  <text class="level" x="790" y="105">Head 2 (s2 = 2)</text>

  <path class="edge" d="M 155 225 L 230 225"/>
  <path class="edge" d="M 330 225 C 385 225, 392 168, 447 168"/>
  <path class="edge" d="M 330 225 C 385 225, 392 298, 447 298"/>
  <path class="edge" d="M 563 168 C 625 168, 650 140, 712 140"/>
  <path class="edge" d="M 563 168 C 625 168, 650 220, 712 220"/>
  <path class="edge" d="M 563 298 C 625 298, 650 300, 712 300"/>
  <path class="edge" d="M 563 298 C 625 298, 650 380, 712 380"/>

  <rect class="prompt" x="55" y="195" width="100" height="60" rx="12"/>
  <text class="label" x="105" y="225">I</text>

  <rect class="base" x="230" y="195" width="100" height="60" rx="12"/>
  <text class="label" x="280" y="225">like</text>

  <rect class="head1" x="447" y="138" width="116" height="60" rx="12"/>
  <text class="label" x="505" y="168">cats</text>
  <rect class="head1" x="447" y="268" width="116" height="60" rx="12"/>
  <text class="label" x="505" y="298">dogs</text>

  <rect class="head2" x="712" y="110" width="156" height="60" rx="12"/>
  <text class="label" x="790" y="140">today</text>
  <rect class="head2" x="712" y="190" width="156" height="60" rx="12"/>
  <text class="label" x="790" y="220">too</text>
  <rect class="head2" x="712" y="270" width="156" height="60" rx="12"/>
  <text class="label" x="790" y="300">today</text>
  <rect class="head2" x="712" y="350" width="156" height="60" rx="12"/>
  <text class="label" x="790" y="380">too</text>

  <text class="caption" x="480" y="440">Leaves: 2 x 2 = 4 complete candidates. Candidate nodes: 2 + 4 = 6.</text>
</svg>
